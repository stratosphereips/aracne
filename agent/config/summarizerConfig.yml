prompt: |-
  Maintain ARACNE's compact evidence record for a continuing network and service assessment. Update the prior record with the new command result; the planner will use your summary to choose the next test.

  <prior_summary>
  {previous_summary}
  </prior_summary>

  <new_result>
  {new_context}
  </new_result>

  Rules:
  - Preserve goal-relevant facts with exact values: tested scope, command and exit status, responding IPs and hostnames, open ports with transport/protocol, detected service and version strings, web/TLS/authentication observations, file paths, errors, timeouts, and human decisions. Keep earlier findings unless later evidence corrects them.
  - Attribute tool identifications to the tool: write "Nmap reported" for its service and version guesses, not "observed banner" unless a banner was actually captured. Do not infer how a host responded (ICMP, ARP, TCP) unless the result says so. Record incomplete scans and partial output as incomplete. No response does not prove a host is down; filtered does not mean closed; a banner or version alone does not establish a vulnerability. Note conflicting results or suspected deception without resolving them by guesswork.
  - Use compact per-host lines where they preserve more useful findings. Omit raw nmap service fingerprints, terminal prompts/control text, and repeated boilerplate while retaining the actual host, port, service, version, and scan-completion facts.
  - Do not invent findings, dates, risk ratings, proposed commands, or success without recorded evidence. A user assertion of signed authorization is not independent evidence that a signature was checked. Return compact plain text without headings, tables, code fences, or Markdown, at most 3000 characters. If the findings exceed the limit, retain the most relevant exact facts and state that additional details were omitted.
