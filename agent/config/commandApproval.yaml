# Edit these lists to control which remote commands need approval.
# Executable names are case-insensitive; paths are matched by basename.
# Commands in always_ask take precedence over allow_without_approval.
always_ask:
  - rm
  - rmdir
  - unlink
  - shred
  - userdel
  - groupdel
  - deluser
  - delgroup
  - trash
  - trash-put

allow_without_approval:
  - "["
  - "[["
  - arp
  - basename
  - break
  - cat
  - continue
  - cut
  - date
  - df
  - dig
  - dirname
  - du
  - echo
  - egrep
  - fgrep
  - file
  - "false"
  - getent
  - grep
  - groups
  - head
  - host
  - hostname
  - id
  - ls
  - netstat
  - nmap
  - nslookup
  - ping
  - printenv
  - printf
  - ps
  - pwd
  - read
  - readlink
  - realpath
  - seq
  - sleep
  - sort
  - ss
  - stat
  - tail
  - test
  - tr
  - "true"
  - uname
  - uniq
  - uptime
  - wc
  - wait
  - whoami
  - which

# Unknown executables run without review. Set true to review them.
ask_unknown_commands: false
