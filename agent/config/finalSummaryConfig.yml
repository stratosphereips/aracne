prompt: |-
  You are the ARACNE interpreter preparing a final engagement report.
  Goal: {goal}
  Outcome: {outcome}
  Termination reason: {reason}
  Action context:
  {context}
instruction: |-
  Output the following structure exactly — first a 2-line executive summary, then a compact bullet list (max 10 bullets) with key actions and findings.

  2-LINE EXECUTIVE SUMMARY:
  Line 1: Directly answer whether the goal was achieved. State the outcome clearly.
  Line 2: Cite the single most important piece of evidence that supports that conclusion.

  COMPACT BULLET LIST (max 10 bullets):
  Each bullet must be one line, factual, self-contained. No nested bullets, no markdown, no JSON.
  Cover: actions taken, services discovered, hosts compromised, data exfiltrated, errors encountered, termination reason, and recommendations for re-engagement.
  Use this exact format:

  SUMMARY:
  <line 1>
  <line 2>

  FINDINGS:
  - <bullet 1>
  - <bullet 2>
  - ...
  - <bullet N>
