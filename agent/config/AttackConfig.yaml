goal: null

# Default role routing. -p/--provider uses the matching preset below instead.
planner_source: openai
planner_model: gpt-6.1-sol
planner_temperature: 1.0
interpreter_source: openai
interpreter_model: gpt-6.1-sol
interpreter_temperature: 1.0
summarizing: false
summarizer_source: openai
summarizer_model: gpt-6.1-sol
summarizer_temperature: 1.0

# The three role models selected by -p. Edit these IDs for your account.
# available_models records other choices; it does not trigger extra API calls.
model_presets:
  openai:
    planner: gpt-6.1-sol
    interpreter: gpt-6.1-sol
    summarizer: gpt-6.1-sol
    available_models: [gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-6-luna]
  cesnet:
    planner: kimi-k3.1-pro
    interpreter: kimi-k3.1-pro
    summarizer: kimi-k3.1-pro
    available_models: [glm-5.3, deepseek-v4.1-flash-thinking, kimi-k3, qwen3.8-flash-next, deepseek-v4.1-flash, glm-5, glm-5.3-flash, qwen3.8-27b, qwen3.5-int4, gpt-oss-120b, mistral-medium-3.5]
  groq:
    planner: openai/gpt-oss-120b
    interpreter: openai/gpt-oss-120b
    summarizer: openai/gpt-oss-120b
    available_models: []
  ollama:
    planner: qwen3:1.7b
    interpreter: qwen3:1.7b
    summarizer: qwen3:1.7b
    available_models: []

action_limit: 50

targets:
  bot1:
    host: 127.0.0.1
    port: 22
    user: pedro
    password_env: BOT1_SSH_PASSWORD
  ubuntu:
    host: localhost
    port: 2222
    user: root
    password: 'y54325342'
  shellm:
    host: localhost
    port: 22
    user: admin
    password: admin
default_target: bot1


llm_providers:
  openai:
    kind: openai
  ollama:
    kind: ollama
    host: localhost
    port: 11434
  cesnet:
    kind: openai
    base_url: https://llm.ai.e-infra.cz/v1
    api_key_env: CESNET_API_KEY
    timeout_seconds: 90
    max_retries: 0
  groq:
    kind: openai
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
